<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="蜂群文化实体商家短视频获客诊断">
  <title>蜂群文化 · 商家获客诊断</title>
  <style>
    :root{--ink:#17211b;--muted:#67716b;--green:#1f6b4f;--green2:#31906d;--honey:#f4b93f;--cream:#f7f5ef;--line:#dddeda;--white:#fff;--danger:#a8392d;--shadow:0 18px 52px rgba(25,42,33,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eef1ec;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;letter-spacing:0;overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:minmax(360px,42%) minmax(0,58%)}
    .conversation{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--white);border-right:1px solid var(--line);z-index:2}.brand{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line)}.brand img{display:block;width:178px;height:52px;object-fit:contain}.brand span{font-size:12px;color:var(--muted);line-height:1.5}
    .progress-wrap{padding:18px 24px 0}.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}.progress{height:6px;background:#e9ece8;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;width:14.285%;background:var(--green);transition:width .35s ease}
    .chat{flex:1;overflow:auto;padding:28px 24px}.intro-tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green);font-weight:700;margin-bottom:14px}.intro-tag:before{content:"";width:8px;height:8px;background:var(--honey);transform:rotate(45deg)}h1{font-size:clamp(24px,3vw,38px);line-height:1.18;margin:0 0 12px}.lead{margin:0 0 26px;color:var(--muted);line-height:1.7;max-width:540px}.bubble{background:var(--cream);border:1px solid #e8e6df;border-radius:8px;padding:17px 18px;margin-bottom:17px;line-height:1.65}.bubble small{display:block;color:var(--green);font-weight:700;margin-bottom:4px}.bubble p{margin:0}.answers{display:grid;gap:10px}.choice{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:.18s}.choice:hover{border-color:var(--green2);background:#f7fbf8}.choice.selected{border-color:var(--green);box-shadow:inset 3px 0 var(--green);background:#f3f9f5}.choice .mark{width:20px;height:20px;border:1px solid #bbc2bd;border-radius:50%;display:grid;place-items:center;flex:0 0 20px}.choice.selected .mark{background:var(--green);border-color:var(--green);color:#fff}.choice.selected .mark:after{content:"✓";font-size:12px}.other{margin-top:13px}.other label,.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.other textarea,.field input{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px 13px;color:var(--ink);background:#fff;outline:none}.other textarea:focus,.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,107,79,.1)}.other textarea{min-height:76px;resize:vertical}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field small{color:var(--muted)}
    .controls{display:flex;align-items:center;gap:10px;padding:16px 24px 22px;border-top:1px solid var(--line);background:#fff}.btn{border:0;border-radius:7px;padding:12px 17px;font-weight:700;min-height:45px}.btn-primary{background:var(--green);color:#fff;flex:1}.btn-primary:hover{background:#17563f}.btn-primary:disabled{background:#aab3ad;cursor:not-allowed}.btn-ghost{background:#f0f2ef;color:var(--ink)}.btn-ghost:disabled{opacity:.45;cursor:not-allowed}.restart{border:0;background:none;color:var(--muted);padding:9px 4px;text-decoration:underline;text-underline-offset:3px}.status{font-size:13px;color:var(--muted)}
    .preview{min-width:0;padding:28px;display:flex;align-items:flex-start;justify-content:center}.paper{width:min(820px,100%);min-height:calc(100vh - 56px);background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.report-head{padding:35px 38px 28px;background:#173e30;color:#fff;position:relative}.report-head:after{content:"";position:absolute;right:36px;top:36px;width:36px;height:36px;border:8px solid var(--honey);transform:rotate(45deg);opacity:.9}.eyebrow{color:#f4c862;font-size:12px;font-weight:700}.report-head h2{font-size:28px;line-height:1.25;margin:10px 70px 9px 0}.report-head p{margin:0;color:#dce9e2;line-height:1.65}.report-body{padding:30px 38px 40px}.empty{display:grid;place-items:center;min-height:460px;text-align:center;color:var(--muted);padding:50px}.empty-icon{width:72px;height:72px;border:2px solid #b9c7bf;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-size:30px;color:var(--green)}.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}.score-row{display:grid;grid-template-columns:124px 1fr;gap:24px;align-items:center;margin-bottom:28px}.score{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--honey) var(--score),#e5e9e6 0);position:relative}.score:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.score b{font-size:34px;z-index:1}.score b small{font-size:13px;color:var(--muted)}.summary{color:#4e5d55;line-height:1.7;margin:0}.section{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.section h3{font-size:18px;margin:0 0 16px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#edf7f1;color:#195c43;padding:8px 11px;border-radius:5px;font-size:13px;font-weight:700}.dimension{display:grid;grid-template-columns:110px 1fr 42px;gap:12px;align-items:center;margin:14px 0}.dimension-name{font-size:13px}.bar{height:9px;background:#e8ebe9;border-radius:5px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--honey));border-radius:5px}.dimension b{font-size:13px}.dimension-comment{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-7px}.finding{padding:17px 0;border-bottom:1px solid #eceeeb}.finding:last-child{border-bottom:0}.finding h4{margin:0 0 7px;font-size:15px}.finding p{margin:5px 0;color:#536059;line-height:1.6;font-size:14px}.finding .action{color:var(--green);font-weight:700}.plan{margin:0;padding:0;list-style:none;counter-reset:item}.plan li{counter-increment:item;display:grid;grid-template-columns:30px 1fr;gap:10px;margin:13px 0;line-height:1.55}.plan li:before{content:counter(item);width:26px;height:26px;background:var(--honey);display:grid;place-items:center;font-weight:800;border-radius:4px}.report-image{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:7px}.cta{margin-top:28px;background:#f4f0e4;border-left:4px solid var(--honey);padding:20px}.cta h3{margin:0 0 7px}.cta p{margin:5px 0;line-height:1.65;color:#4d574f}.wechat{display:inline-block;margin-top:9px;background:var(--green);color:#fff;padding:10px 14px;border-radius:5px;font-weight:800}.error{border:1px solid #e7bbb5;background:#fff6f4;color:var(--danger);padding:14px;border-radius:7px;margin-top:15px}.error button{margin-top:9px;color:var(--danger);font-weight:700;background:#fff;border:1px solid #d99b92;border-radius:5px;padding:7px 10px}
    @media(max-width:820px){.app{display:block}.conversation{position:relative;height:auto;min-height:100svh;border-right:0}.chat{overflow:visible;padding:24px 18px}.brand,.progress-wrap{padding-left:18px;padding-right:18px}.controls{position:sticky;bottom:0;padding:12px 18px;box-shadow:0 -8px 20px rgba(25,42,33,.08)}.preview{padding:18px;background:#e9ede8}.paper{min-height:0}.report-head,.report-body{padding-left:22px;padding-right:22px}.report-head h2{font-size:23px}.score-row{grid-template-columns:1fr;text-align:center}.score{margin:auto}.details{grid-template-columns:1fr}.dimension{grid-template-columns:88px 1fr 36px}.preview:not(.has-report){display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <section class="conversation" aria-labelledby="page-title">
      <header class="brand"><img src="/assets/蜂群文化-logo.jpg" alt="蜂群文化 Bee Colony"><span>实体商家<br>短视频获客诊断</span></header>
      <div class="progress-wrap"><div class="progress-meta"><span id="roundLabel">第 1 轮 / 共 7 轮</span><span id="progressText">14%</span></div><div class="progress" role="progressbar" aria-label="诊断进度" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1"><i id="progressBar"></i></div></div>
      <div class="chat" id="chat"><span class="intro-tag">约 3 分钟完成</span><h1 id="page-title">看清获客卡点，找到下一步</h1><p class="lead">基于你的真实经营情况梳理短视频获客能力。诊断结果仅作经营参考，不承诺流量或业绩。</p><div id="questionArea"></div><div id="errorBox" aria-live="polite"></div></div>
      <footer class="controls"><button class="btn btn-ghost" id="backBtn" type="button">← 返回</button><button class="btn btn-primary" id="nextBtn" type="button" disabled>下一题</button><button class="restart" id="restartBtn" type="button">重新开始</button></footer>
    </section>
    <section class="preview" id="preview" aria-label="诊断报告预览"><article class="paper" id="paper"><div class="empty"><div><div class="empty-icon" aria-hidden="true">⌁</div><strong>你的诊断报告将在这里生成</strong><span>完成左侧 7 轮问题后，我们会根据你的回答生成分析。</span></div></div></article></section>
  </main>
  <script>
    const questions=[
      {id:'business_stage',question:'你目前的经营状态更接近哪一种？',options:['刚开业或筹备中，还在建立基础客流','经营稳定，但新增客户开始放缓','有一定口碑，想通过短视频扩大获客','门店较多，希望建立可复制的获客体系']},
      {id:'business_type',question:'你的门店主要属于哪个行业？',options:['餐饮 / 茶饮 / 烘焙','美业 / 养生 / 健康服务','教育 / 亲子 / 兴趣培训','零售 / 家居 / 本地生活服务','其他行业'],text:'可以补充具体品类（选填）'},
      {id:'traffic_source',question:'目前新客户主要从哪里来？',options:['熟客转介绍与自然到店','团购或本地生活平台','朋友圈、社群等私域渠道','抖音 / 视频号 / 小红书等内容平台','渠道比较分散，还说不清主来源']},
      {id:'content_status',question:'你现在的短视频内容处于什么阶段？',options:['还没有开始做','偶尔拍，更新不稳定','持续更新，但播放与到店转化一般','已有稳定内容栏目和出镜人设','团队化运营，正在优化投放与转化']},
      {id:'core_challenge',question:'目前最希望优先解决的获客问题是？',options:['不知道该拍什么，内容缺少方向','有播放但没有咨询或到店','缺少能稳定出镜和持续执行的人','线上平台多，线索承接流程混乱','客单、复购或转介绍仍需提升'],text:'也可以描述一个最具体的卡点（选填）'},
      {id:'execution_capacity',question:'每周能投入短视频获客的实际资源是多少？',options:['老板个人零散投入，少于 3 小时','1 人兼职执行，每周 3–8 小时','有 1–2 人稳定执行，可持续拍摄发布','有专职团队和基础投放预算','尚未确定，需要先明确投入产出路径']},
      {id:'goal_90_days',question:'未来 90 天，你最想看到哪项具体变化？',options:['建立清晰定位与可执行内容计划','稳定获得本地咨询线索','提升团购核销与到店成交','搭建私域承接与复购流程','跑通单店模型并准备复制'],text:'补充目标数字或经营背景（选填）',details:true}
    ];
    let current=0,answers=Array(7).fill(null),loading=false,lastPayload=null;
    const $=s=>document.querySelector(s), area=$('#questionArea'), next=$('#nextBtn'), back=$('#backBtn'), errorBox=$('#errorBox');
    function renderQuestion(){const q=questions[current],a=answers[current]||{};$('#roundLabel').textContent=`第 ${current+1} 轮 / 共 7 轮`;$('#progressText').textContent=`${Math.round((current+1)/7*100)}%`;$('#progressBar').style.width=`${(current+1)/7*100}%`;$('.progress').setAttribute('aria-valuenow',current+1);area.innerHTML=`<div class="bubble"><small>问题 ${current+1}</small><p>${q.question}</p></div><div class="answers" role="radiogroup" aria-label="${q.question}">${q.options.map(o=>`<button type="button" class="choice ${a.answer===o?'selected':''}" role="radio" aria-checked="${a.answer===o}" data-value="${o}"><span class="mark" aria-hidden="true"></span><span>${o}</span></button>`).join('')}</div>${q.text?`<div class="other"><label for="note">${q.text}</label><textarea id="note" maxlength="200" placeholder="请按实际情况填写">${esc(a.note||'')}</textarea></div>`:''}${q.details?`<div class="details"><div class="field"><label for="merchant">商家 / 门店名称</label><input id="merchant" maxlength="40" value="${esc(a.merchantName||'')}" placeholder="例如：XX 烘焙"><small>用于报告标题</small></div><div class="field"><label for="city">所在城市</label><input id="city" maxlength="30" value="${esc(a.city||'')}" placeholder="例如：杭州"></div></div>`:''}`;area.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{answers[current]={...answers[current],answer:b.dataset.value};renderQuestion()}));const note=$('#note');if(note)note.addEventListener('input',e=>answers[current]={...answers[current],note:e.target.value});['merchant','city'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('input',e=>answers[current]={...answers[current],[id==='merchant'?'merchantName':'city']:e.target.value})});back.disabled=current===0||loading;next.disabled=!a.answer||loading;next.textContent=current===6?'生成诊断报告':'下一题';}
    function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    next.addEventListener('click',()=>{if(!answers[current]?.answer)return;errorBox.innerHTML='';if(current<6){current++;renderQuestion();area.scrollIntoView({behavior:'smooth',block:'start'})}else submitReport()});back.addEventListener('click',()=>{if(current>0){errorBox.innerHTML='';current--;renderQuestion()}});$('#restartBtn').addEventListener('click',()=>{current=0;answers=Array(7).fill(null);loading=false;lastPayload=null;errorBox.innerHTML='';$('#preview').classList.remove('has-report');$('#paper').innerHTML='<div class="empty"><div><div class="empty-icon" aria-hidden="true">⌁</div><strong>你的诊断报告将在这里生成</strong><span>完成左侧 7 轮问题后，我们会根据你的回答生成分析。</span></div></div>';renderQuestion()});
    async function submitReport(){const final=answers[6]||{};errorBox.innerHTML='';lastPayload={answers:questions.map((q,i)=>({id:q.id,question:q.question,value:[answers[i]?.answer,answers[i]?.note].filter(Boolean).join('；')})),merchantName:(final.merchantName||'').trim(),city:(final.city||'').trim()};loading=true;renderQuestion();next.textContent='正在生成…';try{const res=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastPayload)});let data;try{data=await res.json()}catch{throw new Error('服务返回格式异常，请稍后重试。')}if(!res.ok||!data.success||!data.report)throw new Error(data?.error||data?.message||`生成失败（${res.status}），请稍后重试。`);renderReport(data.report);if(data.report.imagePrompt)generateReportImage(data.report)}catch(err){errorBox.innerHTML=`<div class="error" role="alert">${esc(err.message||'网络连接失败，请检查网络后重试。')}<br><button type="button" id="retryBtn">重试生成</button></div>`;$('#retryBtn').onclick=submitReport}finally{loading=false;renderQuestion()}}
    async function generateReportImage(report){try{const res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:report.imagePrompt})});if(!res.ok)return;const data=await res.json(),result=data?.data?.[0]||data;const imageUrl=result?.url||(result?.b64_json?`data:image/png;base64,${result.b64_json}`:null);if(imageUrl){report.imageUrl=imageUrl;renderReport(report,false)}}catch{/* 配图是增强项，不影响已生成的报告。 */}}
    function renderReport(r,shouldScroll=true){const score=Math.max(0,Math.min(100,Number(r.score)||0)),safeArr=v=>Array.isArray(v)?v:[];document.title=`${r.title||'获客诊断报告'} · 蜂群文化`;$('#paper').innerHTML=`<header class="report-head"><span class="eyebrow">蜂群文化 · 商家获客诊断报告</span><h2>${esc(r.title||'获客诊断报告')}</h2><p>${esc([lastPayload?.merchantName,lastPayload?.city].filter(Boolean).join(' · ')||'基于本次问诊回答生成')}</p></header><div class="report-body"><div class="score-row"><div class="score" style="--score:${score*3.6}deg"><b>${score}<small>/100</small></b></div><p class="summary">${esc(r.summary||'')}</p></div>${safeArr(r.highlights).length?`<section class="section"><h3>当前优势</h3><div class="chips">${safeArr(r.highlights).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`:''}${safeArr(r.dimensions).length?`<section class="section"><h3>能力维度</h3>${safeArr(r.dimensions).map(d=>{const s=Math.max(0,Math.min(100,Number(d.score)||0));return `<div class="dimension"><span class="dimension-name">${esc(d.name)}</span><div class="bar"><i style="width:${s}%"></i></div><b>${s}</b><span class="dimension-comment">${esc(d.comment||'')}</span></div>`}).join('')}</section>`:''}${safeArr(r.diagnosis).length?`<section class="section"><h3>关键诊断</h3>${safeArr(r.diagnosis).map(d=>`<article class="finding"><h4>${esc(d.title)}</h4><p>${esc(d.finding)}</p><p class="action">建议：${esc(d.action)}</p></article>`).join('')}</section>`:''}${safeArr(r.actionPlan).length?`<section class="section"><h3>下一步行动计划</h3><ol class="plan">${safeArr(r.actionPlan).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}${r.imageUrl?`<section class="section"><h3>专属视觉建议</h3><img class="report-image" src="${esc(r.imageUrl)}" alt="根据诊断结果生成的视觉建议" loading="lazy"></section>`:''}<aside class="cta"><h3>需要一起拆解执行方案？</h3><p>添加微信可预约 1 对 1 沟通，我们会结合你的实际经营情况讨论；咨询不代表对流量、成交或经营结果的承诺。</p><span class="wechat">微信：${esc(r.wechat||'大全daquan088')}</span></aside></div>`;$('#preview').classList.add('has-report');if(shouldScroll)$('#preview').scrollIntoView({behavior:'smooth',block:'start'})}
    renderQuestion();
  </script>
</body>
</html>
