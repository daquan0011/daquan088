ustify-content:space-between;margin-top:9px;font-size:12px;color:#b9cbc3}.magic.done .orb{animation:finish .7s ease both}.report-reveal{animation:reveal .8s cubic-bezier(.2,.8,.2,1)}

<body>
  <main class="app">
    <section class="conversation" aria-labelledby="page-title">
      <header class="brand"><img src="assets/蜂群文化-logo.jpg" alt="蜂群文化 Bee Colony"><span>实体商家<br>短视频获客诊断</span></header>
      <div class="progress-wrap"><div class="progress-meta"><span id="roundLabel">第 1 轮 / 共 10 轮</span><span id="progressText">10%</span></div><div class="progress" role="progressbar" aria-label="诊断进度" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><i id="progressBar"></i></div></div>
      <div class="chat" id="chat"><span class="intro-tag">约 3 分钟完成</span><h1 id="page-title">看清获客卡点，找到下一步</h1><p class="lead">基于你的真实经营情况梳理短视频获客能力。诊断结果仅作经营参考，不承诺流量或业绩。</p><div id="questionArea"></div><div id="errorBox" aria-live="polite"></div></div>
      <footer class="controls"><button class="btn btn-ghost" id="backBtn" type="button">← 返回</button><button class="btn btn-primary" id="nextBtn" type="button" disabled>下一题</button><button class="restart" id="restartBtn" type="button">重新开始</button></footer>
    </section>
    <section class="preview" id="preview" aria-label="诊断报告预览"><article class="paper" id="paper"><div class="empty"><div><div class="empty-icon" aria-hidden="true">⌁</div><strong>你的诊断报告将在这里生成</strong><span>完成左侧 10 轮问题后，我们会根据你的回答生成分析。</span></div></div></article></section>
  </main>
  <section class="magic hidden" id="magic" role="status" aria-live="polite" aria-label="正在生成诊断报告">
    <div class="magic-panel"><div class="orb"><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i><span class="spark" style="left:8%;top:38%;animation-delay:.1s"></span><span class="spark" style="right:5%;top:25%;background:#22d3ee;animation-delay:.4s"></span><span class="spark" style="left:24%;bottom:3%;background:#fb7185;animation-delay:.8s"></span><span class="spark" style="right:19%;bottom:7%;background:#a855f7;animation-delay:1.2s"></span><div class="magic-core"><img src="assets/蜂群文化-logo.jpg" alt=""></div></div><h2>正在唤醒你的增长罗盘</h2><p class="magic-stage" id="magicStage">正在解析经营现状</p><div class="magic-progress"><i id="magicBar"></i></div><div class="magic-meta"><span>蜂群文化AI深度分析</span><b id="magicPercent">0%</b></div></div>
  </section>
  <script>
    const questions=[
      {id:'business_stage',question:'你目前的经营状态更接近哪一种？',options:['刚开业或筹备中，还在建立基础客流','经营稳定，但新增客户开始放缓','有一定口碑，想通过短视频扩大获客','门店较多，希望建立可复制的获客体系']},
      {id:'business_type',question:'你的门店主要属于哪个行业？',options:['餐饮 / 茶饮 / 烘焙','美业 / 养生 / 健康服务','教育 / 亲子 / 兴趣培训','零售 / 家居 / 本地生活服务','其他行业'],text:'可以补充具体品类（选填）'},
      {id:'target_customer',question:'你最希望吸引的目标顾客是哪一类？',options:['周边 3–5 公里的高频刚需客群','重视品质与专业服务的中高客单人群','有明确问题、需要快速解决的人群','亲子 / 家庭共同决策人群','客群还比较分散，尚未明确'],text:'可补充年龄、职业或最在意的问题（选填）'},
      {id:'core_offer',question:'目前最想通过短视频推广的主推项目是什么？',options:['低门槛体验或引流项目','高毛利核心产品 / 服务','套餐、会员或长期服务','新品、季节性活动或团购','还没有确定主推项目'],text:'可补充价格区间和最大卖点（选填）'},
      {id:'traffic_source',question:'目前新客户主要从哪里来？',options:['熟客转介绍与自然到店','团购或本地生活平台','朋友圈、社群等私域渠道','抖音 / 视频号 / 小红书等内容平台','渠道比较分散，还说不清主来源']},
      {id:'content_status',question:'你现在的短视频内容处于什么阶段？',options:['还没有开始做','偶尔拍，更新不稳定','持续更新，但播放与到店转化一般','已有稳定内容栏目和出镜人设','团队化运营，正在优化投放与转化']},
      {id:'core_challenge',question:'目前最希望优先解决的获客问题是？',options:['不知道该拍什么，内容缺少方向','有播放但没有咨询或到店','缺少能稳定出镜和持续执行的人','线上平台多，线索承接流程混乱','客单、复购或转介绍仍需提升'],text:'也可以描述一个最具体的卡点（选填）'},
      {id:'execution_capacity',question:'每周能投入短视频获客的实际资源是多少？',options:['老板个人零散投入，少于 3 小时','1 人兼职执行，每周 3–8 小时','有 1–2 人稳定执行，可持续拍摄发布','有专职团队和基础投放预算','尚未确定，需要先明确投入产出路径']},
      {id:'conversion_status',question:'目前从短视频到到店的大致转化情况如何？',options:['还未正式发布，暂无数据','有播放，但每月有效咨询少于 10 个','每月约 10–30 个咨询，偶尔到店','咨询和加微较稳定，但到店成交波动较大','已能持续追踪播放、咨询、加微、到店和成交'],text:'可填写近期播放、咨询、加微或到店数字（选填）'},
      {id:'goal_90_days',question:'未来 90 天，你最想看到哪项具体变化？',options:['建立清晰定位与可执行内容计划','稳定获得本地咨询线索','提升团购核销与到店成交','搭建私域承接与复购流程','跑通单店模型并准备复制'],text:'补充目标数字或经营背景（选填）',details:true}
    ];
    const total=questions.length,MIN_ANALYSIS_MS=18000,stages=['正在解析经营现状','正在识别获客卡点','正在计算六维罗盘','正在生成增长路径','正在绘制专属报告'];
    let current=0,answers=Array(total).fill(null),loading=false,lastPayload=null,magicTimer=null,magicStarted=0;
    const $=s=>document.querySelector(s),area=$('#questionArea'),next=$('#nextBtn'),back=$('#backBtn'),errorBox=$('#errorBox');

    function industrySection(){const p=industryPack(),li=items=>items.map(x=>`<li>${esc(x)}</li>`).join('');return`<section class="section industry-section"><h3>${esc(p.industry)}专属短视频作战方案</h3><div class="industry-grid"><div class="cover-preview" style="--cover-a:${p.colors[0]};--cover-b:${p.colors[1]}"><span class="cover-badge">封面示意 · 9:16</span><div><h4>${esc(p.cover)}</h4><p>${esc(p.sub)}</p></div></div><div class="strategy-stack"><article class="strategy-card"><h4>账号定位</h4><p>用“本地可信赖的${esc(p.industry)}顾问”建立专业记忆，围绕${esc(p.offer)}持续输出真实过程、专业判断和客户结果。</p></article><article class="strategy-card"><h4>背景音乐与声音</h4><p>${esc(p.music)}</p></article><article class="strategy-card"><h4>前3秒钩子</h4><p>${esc(p.hook)}</p></article><article class="strategy-card"><h4>可直接套用的标题</h4><ul class="strategy-list">${li(p.titles)}</ul></article></div></div><div class="strategy-card" style="margin-top:12px"><h4>首批6个选题</h4><ul class="topic-grid">${li(p.topics)}</ul></div><div class="strategy-card" style="margin-top:12px"><h4>单条视频脚本结构</h4><div class="content-flow"><span>痛点钩子<br>0–3秒</span><span>现场证据<br>4–12秒</span><span>专业解法<br>13–35秒</span><span>私信行动<br>结尾5秒</span></div></div><div class="strategy-card" style="margin-top:12px"><h4>拍摄与发布节奏</h4><p>每周集中拍摄一次，拆成 4–5 条；建议“2条专业科普 + 1条真实案例 + 1条门店现场 + 1条老板观点”。连续发布14天后，以完播率、私信数和到店数复盘，不只看播放量。</p></div><div class="strategy-card" style="margin-top:12px"><h4>评论与私信承接话术</h4><p>视频结尾：“想知道自己适合哪种方案，评论区留‘方案’。” 私信首句：“看到了你的情况，我先问你3个问题，判断后再给建议，不急着推荐项目。”</p></div></section>`}
    const reportObserver=new MutationObserver(()=>{const body=$('#paper .report-body'),cta=body?.querySelector('.cta');if(!body||!cta||body.querySelector('.industry-section'))return;cta.insertAdjacentHTML('beforebegin',industrySection());cta.innerHTML=`<div class="cta-copy"><h3>需要一起拆解执行方案？</h3><p>扫码添加微信，预约 1 对 1 沟通。我们会结合你的行业、门店和目标，进一步拆解选题、脚本与转化路径。</p><span class="wechat">微信：大全daquan088</span></div><div class="qr-wrap"><img src="assets/wechat-qr.jpg" alt="大全daquan088 微信二维码" loading="lazy"><small>长按或扫码添加微信</small></div>`});
    reportObserver.observe($('#paper'),{childList:true,subtree:true});
    renderQuestion();
  </script>
