de{grid-column:1/-1}.chart-card h4{margin:0 0 3px;font-size:14px}.chart-card p{font-size:11px;color:var(--muted);margin:0 0 8px}.chart-card svg{display:block;width:100%;height:auto;max-height:330px}.chart-legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted);margin-top:4px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.dimension{display:grid;grid-template-columns:110px 1fr 42px;gap:12px;align-items:center;margin:14px 0}.dimension-name{font-size:13px}.bar{height:9px;background:#e8ebe9;border-radius:5px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--honey));border-radius:5px}.dimension b{font-size:13px}.dimension-comment{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-7px}.finding{padding:17px 0;border-bottom:1px solid #eceeeb}.finding:last-child{border-bottom:0}.finding h4{margin:0 0 7px;font-size:15px}.finding p{margin:5px 0;color:#536059;line-height:1.6;font-size:14px}.finding .action{color:var(--green);font-weight:700}.plan{margin:0;padding:0;list-style:none;counter-reset:item}.plan li{counter-increment:item;display:grid;grid-template-columns:30px 1fr;gap:10px;margin:13px 0;line-height:1.55}.plan li:before{content:counter(item);width:26px;height:26px;background:var(--honey);display:grid;place-items:center;font-weight:800;border-radius:4px}.report-image{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:7px}.cta{margin-top:28px;background:#f4f0e4;border-left:4px solid var(--honey);padding:20px}.cta h3{margin:0 0 7px}.cta p{margin:5px 0;line-height:1.65;color:#4d574f}.wechat{display:inline-block;margin-top:9px;background:var(--green);color:#fff;padding:10px 14px;border-radius:5px;font-weight:800}.error{border:1px solid #e7bbb5;background:#fff6f4;color:var(--danger);padding:14px;border-radius:7px;margin-top:15px}.error button{margin-top:9px;color:var(--danger);font-weight:700;background:#fff;border:1px solid #d99b92;border-radius:5px;padding:7px 10px}
    .magic{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#204f42,#0d211a 68%);display:grid;place-items:center;color:#fff;overflow:hidden}.magic.hidden{display:none}.magic:before{content:"";position:absolute;inset:0;background-image:linear-gradient(30deg,rgba(244,185,63,.08) 12%,transparent 12.5%,transparent 87%,rgba(244,185,63,.08) 87.5%),linear-gradient(150deg,rgba(244,185,63,.08) 12%,transparent 12.5%,transparent 87%,rgba(244,185,63,.08) 87.5%);background-size:72px 126px;animation:hive 8s linear infinite}.magic-panel{position:relative;width:min(92vw,520px);text-align:center}.orb{position:relative;width:220px;height:220px;margin:0 auto 26px}.ring{position:absolute;border-radius:50%;inset:0;border:2px solid transparent;border-top-color:#f4c862;border-right-color:#a855f7;filter:drop-shadow(0 0 12px rgba(244,185,63,.6));animation:spin 4s linear infinite}.ring.r2{inset:24px;border-top-color:#22d3ee;border-left-color:#fb7185;animation-duration:2.7s;animation-direction:reverse}.ring.r3{inset:52px;border-top-color:#34d399;border-right-color:#fbbf24;animation-duration:1.9s}.magic-core{position:absolute;inset:76px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 38px rgba(244,185,63,.65);animation:pulse 1.6s ease-in-out infinite;overflow:hidden}.magic-core img{width:100%;height:100%;object-fit:cover;object-position:left center}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#f4c862;box-shadow:0 0 14px currentColor;animation:spark 2.4s ease-in-out infinite}.magic h2{font-size:25px;margin:0 0 10px}.magic-stage{height:24px;color:#dce9e2;margin:0 0 24px}.magic-progress{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.magic-progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#34d399,#22d3ee,#a855f7,#fb7185,#f4c862);background-size:240% 100%;animation:shimmer 2s linear infinite;transition:width .18s linear}.magic-meta{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:#b9cbc3}.magic.done .orb{animation:finish .7s ease both}.report-reveal{animation:reveal .8s cubic-bezier(.2,.8,.2,1)}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.09);box-shadow:0 0 52px rgba(244,185,63,.9)}}@keyframes spark{0%,100%{transform:scale(.4);opacity:.25}50%{transform:scale(1.6);opacity:1}}@keyframes shimmer{to{background-position:240% 0}}@keyframes hive{to{background-position:72px 126px}}@keyframes finish{50%{transform:scale(1.18);filter:brightness(1.8)}100%{transform:scale(.3);opacity:0}}@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:820px){.app{display:block}.conversation{position:relative;height:auto;min-height:100svh;border-right:0}.chat{overflow:visible;padding:24px 18px}.brand,.progress-wrap{padding-left:18px;padding-right:18px}.controls{position:sticky;bottom:0;padding:12px 18px;box-shadow:0 -8px 20px rgba(25,42,33,.08)}.preview{padding:18px;background:#e9ede8}.paper{min-height:0}.report-head,.report-body{padding-left:22px;padding-right:22px}.report-head h2{font-size:23px}.score-row{grid-template-columns:1fr;text-align:center}.score{margin:auto}.details,.charts-grid{grid-template-columns:1fr}.chart-card.wide{grid-column:auto}.dimension{grid-template-columns:88px 1fr 36px}.preview:not(.has-report){display:none}.orb{width:190px;height:190px}.magic-core{inset:65px}.magic-core img{width:50px;height:50px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

<body>
  <main class="app">
    <section class="conversation" aria-labelledby="page-title">
      <header class="brand"><img src="/assets/蜂群文化-logo.jpg" alt="蜂群文化 Bee Colony"><span>实体商家<br>短视频获客诊断</span></header>
      <div class="progress-wrap"><div class="progress-meta"><span id="roundLabel">第 1 轮 / 共 10 轮</span><span id="progressText">10%</span></div><div class="progress" role="progressbar" aria-label="诊断进度" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><i id="progressBar"></i></div></div>
      <div class="chat" id="chat"><span class="intro-tag">约 3 分钟完成</span><h1 id="page-title">看清获客卡点，找到下一步</h1><p class="lead">基于你的真实经营情况梳理短视频获客能力。诊断结果仅作经营参考，不承诺流量或业绩。</p><div id="questionArea"></div><div id="errorBox" aria-live="polite"></div></div>
      <footer class="controls"><button class="btn btn-ghost" id="backBtn" type="button">← 返回</button><button class="btn btn-primary" id="nextBtn" type="button" disabled>下一题</button><button class="restart" id="restartBtn" type="button">重新开始</button></footer>
    </section>
    <section class="preview" id="preview" aria-label="诊断报告预览"><article class="paper" id="paper"><div class="empty"><div><div class="empty-icon" aria-hidden="true">⌁</div><strong>你的诊断报告将在这里生成</strong><span>完成左侧 10 轮问题后，我们会根据你的回答生成分析。</span></div></div></article></section>
  </main>
  <section class="magic hidden" id="magic" role="status" aria-live="polite" aria-label="正在生成诊断报告">
    <div class="magic-panel"><div class="orb"><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i><span class="spark" style="left:8%;top:38%;animation-delay:.1s"></span><span class="spark" style="right:5%;top:25%;background:#22d3ee;animation-delay:.4s"></span><span class="spark" style="left:24%;bottom:3%;background:#fb7185;animation-delay:.8s"></span><span class="spark" style="right:19%;bottom:7%;background:#a855f7;animation-delay:1.2s"></span><div class="magic-core"><img src="/assets/蜂群文化-logo.jpg" alt=""></div></div><h2>正在唤醒你的增长罗盘</h2><p class="magic-stage" id="magicStage">正在解析经营现状</p><div class="magic-progress"><i id="magicBar"></i></div><div class="magic-meta"><span>蜂群文化AI深度分析</span><b id="magicPercent">0%</b></div></div>
  </section>
  <script>
    const questions=[
      {id:'business_stage',question:'你目前的经营状态更接近哪一种？',options:['刚开业或筹备中，还在建立基础客流','经营稳定，但新增客户开始放缓','有一定口碑，想通过短视频扩大获客','门店较多，希望建立可复制的获客体系']},
      {id:'business_type',question:'你的门店主要属于哪个行业？',options:['餐饮 / 茶饮 / 烘焙','美业 / 养生 / 健康服务','教育 / 亲子 / 兴趣培训','零售 / 家居 / 本地生活服务','其他行业'],text:'可以补充具体品类（选填）'},
      {id:'target_customer',question:'你最希望吸引的目标顾客是哪一类？',options:['周边 3–5 公里的高频刚需客群','重视品质与专业服务的中高客单人群','有明确问题、需要快速解决的人群','亲子 / 家庭共同决策人群','客群还比较分散，尚未明确'],text:'可补充年龄、职业或最在意的问题（选填）'},
      {id:'core_offer',question:'目前最想通过短视频推广的主推项目是什么？',options:['低门槛体验或引流项目','高毛利核心产品 / 服务','套餐、会员或长期服务','新品、季节性活动或团购','还没有确定主推项目'],text:'可补充价格区间和最大卖点（选填）'},
      {id:'traffic_source',question:'目前新客户主要从哪里来？',options:['熟客转介绍与自然到店','团购或本地生活平台','朋友圈、社群等私域渠道','抖音 / 视频号 / 小红书等内容平台','渠道比较分散，还说不清主来源']},
      {id:'content_status',question:'你现在的短视频内容处于什么阶段？',options:['还没有开始做','偶尔拍，更新不稳定','持续更新，但播放与到店转化一般','已有稳定内容栏目和出镜人设','团队化运营，正在优化投放与转化']},
      {id:'core_challenge',question:'目前最希望优先解决的获客问题是？',options:['不知道该拍什么，内容缺少方向','有播放但没有咨询或到店','缺少能稳定出镜和持续执行的人','线上平台多，线索承接流程混乱','客单、复购或转介绍仍需提升'],text:'也可以描述一个最具体的卡点（选填）'},
      {id:'execution_capacity',question:'每周能投入短视频获客的实际资源是多少？',options:['老板个人零散投入，少于 3 小时','1 人兼职执行，每周 3–8 小时','有 1–2 人稳定执行，可持续拍摄发布','有专职团队和基础投放预算','尚未确定，需要先明确投入产出路径']},
      {id:'conversion_status',question:'目前从短视频到到店的大致转化情况如何？',options:['还未正式发布，暂无数据','有播放，但每月有效咨询少于 10 个','每月约 10–30 个咨询，偶尔到店','咨询和加微较稳定，但到店成交波动较大','已能持续追踪播放、咨询、加微、到店和成交'],text:'可填写近期播放、咨询、加微或到店数字（选填）'},
      {id:'goal_90_days',question:'未来 90 天，你最想看到哪项具体变化？',options:['建立清晰定位与可执行内容计划','稳定获得本地咨询线索','提升团购核销与到店成交','搭建私域承接与复购流程','跑通单店模型并准备复制'],text:'补充目标数字或经营背景（选填）',details:true}
    ];
    const total=questions.length,MIN_ANALYSIS_MS=18000,stages=['正在解析经营现状','正在识别获客卡点','正在计算六维罗盘','正在生成增长路径','正在绘制专属报告'];
    let current=0,answers=Array(total).fill(null),loading=false,lastPayload=null,magicTimer=null,magicStarted=0;
    const $=s=>document.querySelector(s),area=$('#questionArea'),next=$('#nextBtn'),back=$('#backBtn'),errorBox=$('#errorBox');
    function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function score(v,f=50){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):f}
    function renderQuestion(){const q=questions[current],a=answers[current]||{},pct=Math.round((current+1)/total*100);$('#roundLabel').textContent=`第 ${current+1} 轮 / 共 ${total} 轮`;$('#progressText').textContent=`${pct}%`;$('#progressBar').style.width=`${pct}%`;$('.progress').setAttribute('aria-valuenow',current+1);$('.progress').setAttribute('aria-valuemax',total);area.innerHTML=`<div class="bubble"><small>问题 ${current+1}</small><p>${q.question}</p></div><div class="answers" role="radiogroup" aria-label="${q.question}">${q.options.map(o=>`<button type="button" class="choice ${a.answer===o?'selected':''}" role="radio" aria-checked="${a.answer===o}" data-value="${esc(o)}"><span class="mark" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join('')}</div>${q.text?`<div class="other"><label for="note">${q.text}</label><textarea id="note" maxlength="200" placeholder="请按实际情况填写">${esc(a.note||'')}</textarea></div>`:''}${q.details?`<div class="details"><div class="field"><label for="merchant">商家 / 门店名称</label><input id="merchant" maxlength="40" value="${esc(a.merchantName||'')}" placeholder="例如：XX 烘焙"><small>用于报告标题</small></div><div class="field"><label for="city">所在城市</label><input id="city" maxlength="30" value="${esc(a.city||'')}" placeholder="例如：杭州"></div></div>`:''}`;area.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{answers[current]={...answers[current],answer:b.dataset.value};renderQuestion()}));const note=$('#note');if(note)note.addEventListener('input',e=>answers[current]={...answers[current],note:e.target.value});['merchant','city'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('input',e=>answers[current]={...answers[current],[id==='merchant'?'merchantName':'city']:e.target.value})});back.disabled=current===0||loading;next.disabled=!a.answer||loading;next.textContent=current===total-1?'生成魔法诊断报告':'下一题'}
    next.addEventListener('click',()=>{if(!answers[current]?.answer)return;errorBox.innerHTML='';if(current<total-1){current++;renderQuestion();area.scrollIntoView({behavior:'smooth',block:'start'})}else submitReport()});
    back.addEventListener('click',()=>{if(current>0&&!loading){errorBox.innerHTML='';current--;renderQuestion()}});
    $('#restartBtn').addEventListener('click',()=>{if(loading)return;current=0;answers=Array(total).fill(null);lastPayload=null;errorBox.innerHTML='';$('#preview').classList.remove('has-report');$('#paper').innerHTML=`<div class="empty"><div><div class="empty-icon" aria-hidden="true">⌁</div><strong>你的诊断报告将在这里生成</strong><span>完成左侧 ${total} 轮问题后，我们会根据你的回答生成分析。</span></div></div>`;renderQuestion()});
    function startMagic(){magicStarted=Date.now();const magic=$('#magic');magic.classList.remove('hidden','done');$('#magicBar').style.width='0%';$('#magicPercent').textContent='0%';$('#magicStage').textContent=stages[0];magicTimer=setInterval(()=>{const elapsed=Date.now()-magicStarted,pct=elapsed<MIN_ANALYSIS_MS?Math.min(94,elapsed/MIN_ANALYSIS_MS*94):96,stage=Math.min(stages.length-1,Math.floor(elapsed/(MIN_ANALYSIS_MS/stages.length)));$('#magicBar').style.width=`${pct}%`;$('#magicPercent').textContent=`${Math.round(pct)}%`;$('#magicStage').textContent=elapsed<MIN_ANALYSIS_MS?stages[stage]:'正在完成最后的深度推演…'},120)}
    async function finishMagic(){const remaining=Math.max(0,MIN_ANALYSIS_MS-(Date.now()-magicStarted));if(remaining)await new Promise(r=>setTimeout(r,remaining));clearInterval(magicTimer);$('#magicBar').style.width='100%';$('#magicPercent').textContent='100%';$('#magicStage').textContent='诊断完成，正在展开专属报告';$('#magic').classList.add('done');await new Promise(r=>setTimeout(r,700));$('#magic').classList.add('hidden')}
    function stopMagic(){clearInterval(magicTimer);$('#magic').classList.add('hidden');$('#magic').classList.remove('done')}
    async function submitReport(){const final=answers[total-1]||{};errorBox.innerHTML='';lastPayload={answers:questions.map((q,i)=>({id:q.id,question:q.question,value:[answers[i]?.answer,answers[i]?.note].filter(Boolean).join('；')})),merchantName:(final.merchantName||'').trim(),city:(final.city||'').trim()};loading=true;renderQuestion();startMagic();try{const res=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastPayload)});let data;try{data=await res.json()}catch{throw new Error('服务返回格式异常，请稍后重试。')}if(!res.ok||!data.success||!data.report)throw new Error(data?.error||data?.message||`生成失败（${res.status}），请稍后重试。`);await finishMagic();renderReport(data.report);if(data.report.imagePrompt)generateReportImage(data.report)}catch(err){stopMagic();errorBox.innerHTML=`<div class="error" role="alert">${esc(err.message||'网络连接失败，请检查网络后重试。')}<br><button type="button" id="retryBtn">重试生成</button></div>`;$('#retryBtn').onclick=submitReport}finally{loading=false;renderQuestion()}}
    async function generateReportImage(report){try{const res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:report.imagePrompt})});if(!res.ok)return;const data=await res.json(),result=data?.data?.[0]||data,imageUrl=result?.url||(result?.b64_json?`data:image/png;base64,${result.b64_json}`:null);if(imageUrl){report.imageUrl=imageUrl;renderReport(report,false)}}catch{/* 配图失败不影响诊断报告。 */}}
    function chartData(r){const dims=Array.isArray(r.dimensions)?r.dimensions:[],names=['定位清晰度','客群洞察力','内容吸引力','持续执行力','线索承接力','成交复购力'],radar=(r.charts?.radar?.length?r.charts.radar:names.map((name,i)=>({name,score:score(dims[i]?.score,60-i*3)}))).slice(0,6),funnel=(r.charts?.funnel?.length?r.charts.funnel:[{name:'内容触达',value:100},{name:'有效咨询',value:68},{name:'加微承接',value:55},{name:'到店成交',value:43}]).slice(0,4),comparison=(r.charts?.comparison?.length?r.charts.comparison:[{name:'内容稳定度',current:55,target:82},{name:'咨询效率',current:58,target:84},{name:'到店转化',current:48,target:80},{name:'复购能力',current:62,target:86}]).slice(0,4);return{radar:radar.map(x=>({name:String(x.name||'维度').slice(0,8),score:score(x.score)})),funnel:funnel.map(x=>({name:String(x.name||'阶段').slice(0,8),value:score(x.value)})),comparison:comparison.map(x=>({name:String(x.name||'指标').slice(0,8),current:score(x.current),target:score(x.target)}))}}
    function radarSvg(items){const cx=160,cy=155,R=105,colors=['#f4b93f','#22c55e','#22d3ee','#6366f1','#a855f7','#fb7185'],point=(i,r)=>{const a=-Math.PI/2+i*Math.PI*2/items.length;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]},poly=r=>items.map((_,i)=>point(i,r).join(',')).join(' '),grids=[.2,.4,.6,.8,1].map(n=>`<polygon points="${poly(R*n)}" fill="none" stroke="#dfe6e1" stroke-width="1"/>`).join(''),axes=items.map((_,i)=>{const p=point(i,R);return`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#dfe6e1"/>`}).join(''),data=items.map((x,i)=>point(i,R*x.score/100).join(',')).join(' '),labels=items.map((x,i)=>{const p=point(i,R+27);return`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="${colors[i]}">${esc(x.name)}</text><text x="${p[0]}" y="${p[1]+14}" text-anchor="middle" font-size="10" fill="#67716b">${x.score}</text>`}).join('');return`<svg viewBox="0 0 320 320" role="img" aria-label="六维能力罗盘">${grids}${axes}<polygon points="${data}" fill="rgba(168,85,247,.2)" stroke="#7c3aed" stroke-width="3"/>${items.map((x,i)=>{const p=point(i,R*x.score/100);return`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${colors[i]}"/>`}).join('')}${labels}</svg>`}
    function funnelSvg(items){const colors=['#22d3ee','#6366f1','#a855f7','#fb7185'];return`<svg viewBox="0 0 420 270" role="img" aria-label="获客链路健康指数">${items.map((x,i)=>{const w=110+score(x.value)*2.45,y=12+i*62,x0=(420-w)/2;return`<rect x="${x0}" y="${y}" width="${w}" height="48" rx="8" fill="${colors[i]}" opacity="${1-i*.08}"/><text x="210" y="${y+21}" text-anchor="middle" fill="white" font-size="13" font-weight="700">${esc(x.name)}</text><text x="210" y="${y+39}" text-anchor="middle" fill="white" font-size="11">健康指数 ${score(x.value)}</text>`}).join('')}</svg>`}
    function comparisonSvg(items){const colors=['#f4b93f','#22d3ee','#a855f7','#fb7185'],base=210,maxH=145;return`<svg viewBox="0 0 460 250" role="img" aria-label="现状与目标对比">${[0,25,50,75,100].map(v=>`<line x1="38" y1="${base-v/100*maxH}" x2="450" y2="${base-v/100*maxH}" stroke="#e5e8e6"/><text x="30" y="${base-v/100*maxH+4}" text-anchor="end" font-size="9" fill="#89918c">${v}</text>`).join('')}${items.map((x,i)=>{const gx=72+i*96,ch=score(x.current)/100*maxH,th=score(x.target)/100*maxH;return`<rect x="${gx}" y="${base-ch}" width="26" height="${ch}" rx="4" fill="${colors[i]}"/><rect x="${gx+30}" y="${base-th}" width="26" height="${th}" rx="4" fill="#173e30"/><text x="${gx+28}" y="232" text-anchor="middle" font-size="10" fill="#536059">${esc(x.name)}</text>`}).join('')}</svg>`}
    function renderReport(r,shouldScroll=true){const overall=score(r.score,0),safeArr=v=>Array.isArray(v)?v:[],charts=chartData(r);document.title=`${r.title||'获客诊断报告'} · 蜂群文化`;$('#paper').classList.add('report-reveal');$('#paper').innerHTML=`<header class="report-head"><span class="eyebrow">蜂群文化 · 商家获客诊断报告</span><h2>${esc(r.title||'获客诊断报告')}</h2><p>${esc([lastPayload?.merchantName,lastPayload?.city].filter(Boolean).join(' · ')||'基于本次十轮问诊生成')}</p></header><div class="report-body"><div class="score-row"><div class="score" style="--score:${overall*3.6}deg"><b>${overall}<small>/100</small></b></div><p class="summary">${esc(r.summary||'')}</p></div>${safeArr(r.highlights).length?`<section class="section"><h3>你已经做对的地方</h3><div class="chips">${safeArr(r.highlights).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`:''}<section class="section"><h3>获客增长数据图谱</h3><div class="charts-grid"><article class="chart-card"><h4>六维能力罗盘</h4><p>越靠近外圈，代表该项基础越成熟</p>${radarSvg(charts.radar)}</article><article class="chart-card"><h4>获客链路漏斗</h4><p>基于回答推算的链路健康指数，并非真实经营数据</p>${funnelSvg(charts.funnel)}</article><article class="chart-card wide"><h4>现状与90天目标</h4><p>找到最值得优先投入的增长差距</p>${comparisonSvg(charts.comparison)}<div class="chart-legend"><span><i class="legend-dot" style="background:#f4b93f"></i>当前能力</span><span><i class="legend-dot" style="background:#173e30"></i>建议目标</span></div></article></div></section>${safeArr(r.dimensions).length?`<section class="section"><h3>能力维度解读</h3>${safeArr(r.dimensions).map(d=>{const s=score(d.score,0);return`<div class="dimension"><span class="dimension-name">${esc(d.name)}</span><div class="bar"><i style="width:${s}%"></i></div><b>${s}</b><span class="dimension-comment">${esc(d.comment||'')}</span></div>`}).join('')}</section>`:''}${safeArr(r.diagnosis).length?`<section class="section"><h3>关键诊断</h3>${safeArr(r.diagnosis).map(d=>`<article class="finding"><h4>${esc(d.title)}</h4><p>${esc(d.finding)}</p><p class="action">建议：${esc(d.action)}</p></article>`).join('')}</section>`:''}${safeArr(r.actionPlan).length?`<section class="section"><h3>下一步行动计划</h3><ol class="plan">${safeArr(r.actionPlan).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}${r.imageUrl?`<section class="section"><h3>专属视觉建议</h3><img class="report-image" src="${esc(r.imageUrl)}" alt="根据诊断结果生成的视觉建议" loading="lazy"></section>`:''}<aside class="cta"><h3>需要一起拆解执行方案？</h3><p>添加微信可预约 1 对 1 沟通，我们会结合你的实际经营情况讨论；咨询不代表对流量、成交或经营结果的承诺。</p><span class="wechat">微信：${esc(r.wechat||'大全daquan088')}</span></aside></div>`;$('#preview').classList.add('has-report');if(shouldScroll)$('#preview').scrollIntoView({behavior:'smooth',block:'start'})}
    renderQuestion();
  </script>
</body>
</html>
